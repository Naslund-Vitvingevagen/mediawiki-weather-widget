name: Deploy to Synology NAS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, synology]

    steps:
      - name: Hämta kod från GitHub
        uses: actions/checkout@v4

      - name: Kopiera proxy och widget till webbroot
        run: |
          cp wunderground-proxy.php /mnt/web/wunderground-proxy.php
          cp vader-widget.html /mnt/web/vader-widget.html
          echo "✅ Webbfiler kopierade"

      - name: Verifiera att filerna finns
        run: |
          ls -la /mnt/web/wunderground-proxy.php
          ls -la /mnt/web/vader-widget.html
          echo "✅ Deploy klar"